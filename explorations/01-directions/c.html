<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rally Feed, a warm and compact Howl feed exploration." />
    <title>C — Rally Feed · Howl</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./feed.js"></script>
  </head>
  <body data-direction="c">
    <div class="page-shell desktop-layout">
      <aside class="left-rail">
        <a class="wordmark" href="#feed">Howl</a>
        <nav class="nav-links" aria-label="Main navigation">
          <a aria-current="page" href="#feed">Home</a>
          <a href="#places">Places</a>
          <a href="#about">About this round</a>
        </nav>
        <p class="rail-note">Rally Feed<br />C · Quick updates</p>
      </aside>
      <main class="feed-column" id="feed">
        <header class="mobile-header">
          <a class="wordmark" href="#feed">Howl</a>
          <span>Rally Feed</span>
        </header>
        <nav class="mobile-nav" aria-label="Main navigation">
          <a aria-current="page" href="#feed">Home</a>
          <a href="#places">Places</a>
          <a href="#about">About</a>
        </nav>
        <header class="feed-header">
          <h1>Campus, in the moment</h1>
          <nav class="feed-tabs" aria-label="Feed view">
            <a aria-current="page" href="#feed">For you</a>
            <a href="#places">Around campus</a>
          </nav>
        </header>
        <section class="post-list" data-post-list aria-label="Sample student posts"></section>
      </main>
      <aside class="right-rail">
        <section class="rail-section" id="about">
          <h2>Rally Feed</h2>
          <p>A warm paper tone, quick tabs, and a little Wolfpack energy.</p>
        </section>
        <section class="rail-section" id="places">
          <h2>From campus</h2>
          <ul>
            <li>Memorial Belltower</li>
            <li>Free Expression Tunnel</li>
            <li>Pullen Park</li>
          </ul>
        </section>
      </aside>
    </div>
  </body>
</html>
